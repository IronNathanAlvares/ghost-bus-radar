# Virtual workspace root. Each package under packages/ is a workspace member.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ghostbus-core",
    "ghostbus-ingest",
    "ghostbus-jobs",
    "ghostbus-api",
    "boto3-stubs[s3]>=1.44",
    "hypothesis>=6.140",
    "jsonschema>=4.26",
    "types-jsonschema>=4.26",
    "types-protobuf>=6",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv.sources]
ghostbus-core = { workspace = true }
ghostbus-ingest = { workspace = true }
ghostbus-jobs = { workspace = true }
ghostbus-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["ghostbus_core", "ghostbus_ingest", "ghostbus_jobs", "ghostbus_api"]

[tool.mypy]
python_version = "3.11"
# Everything ships in Linux containers or Lambda; type-check for that platform, also on Windows.
platform = "linux"
strict = true
files = ["packages", "tests", "infra"]
mypy_path = ["packages/core/src", "packages/ingest/src", "packages/jobs/src", "packages/api/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*", "py4j", "py4j.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not chaos'"
markers = [
    "integration: needs the local Docker stack (docker compose up); run with -m integration",
    "chaos: kills the streaming pipeline repeatedly (about 10 minutes); run with -m chaos",
]
