[project]
name = "ghostbus-api"
version = "0.1.0"
description = "Will my bus come? Lambda API behind API Gateway (ADR-0012)"
requires-python = ">=3.11,<3.12"
dependencies = ["ghostbus-core", "ghostbus-ingest", "tzdata>=2025.2"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
ghostbus-core = { workspace = true }
ghostbus-ingest = { workspace = true }
