[project]
name = "ghostbus-jobs"
version = "0.1.0"
description = "Spark Structured Streaming and batch jobs"
requires-python = ">=3.11,<3.12"
dependencies = ["ghostbus-core", "ghostbus-ingest", "pyspark==3.5.6"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
ghostbus-core = { workspace = true }
ghostbus-ingest = { workspace = true }
