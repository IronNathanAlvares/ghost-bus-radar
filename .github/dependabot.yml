# Weekly update proposals for the pinned GitHub Actions (keeps commit-SHA pins current) and for the
# uv-locked Python dependencies. Each arrives as a pull request that CI, including the security
# job, must pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
