# Weekly update proposals for the pinned GitHub Actions (keeps commit-SHA pins current) and for the
# uv-locked Python dependencies. Each arrives as a pull request that CI, including the security
# job, must pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to match AWS Glue 5.1's Spark 3.5.6, so local and cloud run the same engine
      # (ADR-0010); upgrade together with the Glue version, not on its own.
      - dependency-name: pyspark
