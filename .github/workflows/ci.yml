name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.25"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  terraform:
    name: terraform fmt and validate, Lambda package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Build the collector Lambda package (arm64 wheels)
        run: uv run python infra/lambda/build_collector.py
      - name: Build the Glue job wheels and pinned modules
        run: uv run python infra/glue/build_jobs.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.17.1"
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate each layer (no AWS credentials, no backend)
        run: |
          for d in bootstrap core; do
            terraform -chdir=infra/terraform/$d init -backend=false -input=false
            terraform -chdir=infra/terraform/$d validate
          done

  security:
    name: security (secrets, dependencies, Terraform)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the whole history: a secret committed and later removed still leaks
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.25"
          enable-cache: true
      # Third-party scanners run as version- or digest-pinned artifacts, never mutable tags:
      # in 2026 Trivy's GitHub release tags were force-pushed to malicious commits.
      - name: Secrets in the full git history (gitleaks, image pinned by digest)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git /repo --redact --no-banner --exit-code 1
      - name: Known vulnerabilities in the locked dependencies (pip-audit)
        run: |
          uv export --all-packages --no-dev --no-hashes --frozen --no-emit-workspace > requirements.txt
          # PYSEC-2026-3966 / CVE-2026-32773: XSS in the Spark History Server, which this project
          # never runs; Glue 5.1 ships Spark 3.5.6 (triaged in docs/07-security.md, re-check 2027-02-15).
          uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-3966
          uvx --from pip-audit==2.10.1 pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-3966 --format cyclonedx-json --output sbom.cdx.json
      - name: Terraform misconfigurations (checkov, triaged skips in .checkov.yaml)
        run: uvx --from checkov==3.4.5 checkov --config-file .checkov.yaml
      - name: Software bill of materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  integration:
    name: Kafka -> Spark -> Iceberg smoke test
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 40
    env:
      COMPOSE: docker compose -f local/docker-compose.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Spark image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: local/spark/Dockerfile
          tags: ghostbus/spark:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ingest image (poller, static watcher)
        run: docker build -f local/ingest/Dockerfile -t ghostbus/ingest:dev .
      - name: Start stack
        run: $COMPOSE up -d --wait
      - name: Integration tests
        run: $COMPOSE run --rm spark pytest -m integration -p no:cacheprovider
      - name: Chaos test (exactly-once under SIGKILL, 10 kills in CI)
        run: $COMPOSE run --rm -e CHAOS_KILLS=10 spark pytest -m chaos -p no:cacheprovider
      - name: Latency probe
        run: $COMPOSE run --rm spark python -m ghostbus_jobs.smoke --events 20
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Stop stack
        if: always()
        run: $COMPOSE down -v
